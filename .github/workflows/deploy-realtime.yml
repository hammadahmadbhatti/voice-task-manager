name: Deploy realtime backend

on:
  push:
    branches: [main]
    paths:
      - "apps/realtime/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-realtime.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

# OIDC: short-lived tokens, no AWS_ACCESS_KEY in repo secrets.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-realtime-${{ github.ref }}
  cancel-in-progress: false # do NOT cancel deploys; let them finish

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # --- Build ---
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build realtime
        run: pnpm --filter @vtm/realtime build

      # --- Package ---
      - name: Create deploy artifact
        id: artifact
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          cp -R apps/realtime/dist "$STAGE/dist"
          cp apps/realtime/package.json "$STAGE/"
          cp -R apps/realtime/node_modules "$STAGE/node_modules"
          cp -R packages/shared "$STAGE/shared"
          # Hoisted root deps that workspace symlinks need
          if [ -d node_modules ]; then
            cp -R node_modules "$STAGE/root_node_modules"
          fi
          DEPLOY_ID="${GITHUB_SHA::8}-$(date +%s)"
          tar -C "$STAGE" -czf "vtm-${DEPLOY_ID}.tgz" .
          echo "deploy_id=${DEPLOY_ID}" >> $GITHUB_OUTPUT
          echo "artifact=vtm-${DEPLOY_ID}.tgz" >> $GITHUB_OUTPUT

      # --- AWS auth (OIDC) ---
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-deploy-${{ github.run_id }}

      # --- Upload to S3 ---
      - name: Upload artifact to S3
        id: upload
        run: |
          set -euo pipefail
          KEY="deploys/${{ steps.artifact.outputs.deploy_id }}.tgz"
          aws s3 cp "${{ steps.artifact.outputs.artifact }}" "s3://${{ vars.DEPLOY_BUCKET }}/${KEY}"
          echo "s3_uri=s3://${{ vars.DEPLOY_BUCKET }}/${KEY}" >> $GITHUB_OUTPUT

      # --- Trigger SSM deploy on the EC2 instance ---
      - name: Run remote deploy via SSM
        id: ssm
        env:
          S3_URI: ${{ steps.upload.outputs.s3_uri }}
          DEPLOY_ID: ${{ steps.artifact.outputs.deploy_id }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          # The script is embedded inline so the EC2 instance doesn't need
          # any pre-deployed deploy tooling. Pull → atomic swap → pm2 reload
          # → health probe with rollback on failure.
          CMD=$(cat <<'SCRIPT'
          set -euo pipefail
          DEPLOY_ID="__DEPLOY_ID__"
          S3_URI="__S3_URI__"
          log() { echo "[$(date -Iseconds)] [deploy:$DEPLOY_ID] $*"; }

          log "Pulling artifact"
          install -d -o vtm -g vtm /opt/vtm/incoming
          aws s3 cp "$S3_URI" /opt/vtm/incoming/app.tgz

          log "Unpacking"
          sudo install -d -o vtm -g vtm /opt/vtm/app.new
          sudo tar -C /opt/vtm/app.new -xzf /opt/vtm/incoming/app.tgz
          sudo chown -R vtm:vtm /opt/vtm/app.new

          log "Swapping"
          sudo rm -rf /opt/vtm/app.old 2>/dev/null || true
          if [ -d /opt/vtm/app ]; then sudo mv /opt/vtm/app /opt/vtm/app.old; fi
          sudo mv /opt/vtm/app.new /opt/vtm/app

          log "pm2 reload"
          sudo -u vtm bash -lc '
            set -euo pipefail
            cd /opt/vtm/app
            export $(grep -v "^#" /opt/vtm/.env | xargs -d "\n")
            pm2 describe vtm >/dev/null 2>&1 \
              && pm2 reload vtm --update-env \
              || pm2 start dist/server.js --name vtm --max-restarts 10 --time
            pm2 save
          '

          log "Health probe"
          for i in $(seq 1 15); do
            if curl -fsS --max-time 2 http://127.0.0.1:4000/health >/dev/null; then
              log "Healthy on attempt $i"
              rm -f /opt/vtm/incoming/app.tgz
              exit 0
            fi
            sleep 1
          done
          log "FAILED — rolling back"
          sudo rm -rf /opt/vtm/app
          sudo mv /opt/vtm/app.old /opt/vtm/app
          sudo -u vtm bash -lc 'cd /opt/vtm/app && pm2 reload vtm --update-env'
          exit 1
          SCRIPT
          )
          # Substitute placeholders without using bash interpolation inside the heredoc.
          CMD="${CMD//__DEPLOY_ID__/$DEPLOY_ID}"
          CMD="${CMD//__S3_URI__/$S3_URI}"

          # Build the --parameters payload as explicit JSON.
          # Shorthand syntax mishandles commas inside multi-line scripts.
          PARAMS_JSON=$(jq -n --arg cmd "$CMD" '{commands: [$cmd]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${DEPLOY_ID}" \
            --parameters "$PARAMS_JSON" \
            --cloud-watch-output-config "CloudWatchOutputEnabled=true,CloudWatchLogGroupName=/${{ vars.PROJECT || 'vtm' }}/deploys" \
            --query "Command.CommandId" --output text)
          echo "cmd_id=$CMD_ID" >> $GITHUB_OUTPUT
          echo "Triggered SSM command: $CMD_ID"

          # Wait + tail
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text >&2 || true

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed: status=$STATUS"
            exit 1
          fi

      - name: Smoke test public endpoint
        if: vars.PUBLIC_HEALTH_URL != ''
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 "${{ vars.PUBLIC_HEALTH_URL }}" >/dev/null; then
              echo "Public health OK"
              exit 0
            fi
            sleep 3
          done
          echo "Public health did not recover"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy ${{ steps.artifact.outputs.deploy_id }}"
            echo "* Commit: \`${{ github.sha }}\`"
            echo "* Artifact: \`${{ steps.upload.outputs.s3_uri }}\`"
            echo "* SSM command: \`${{ steps.ssm.outputs.cmd_id }}\`"
          } >> $GITHUB_STEP_SUMMARY
